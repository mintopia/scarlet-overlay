logLevel: info
logDestinations: [stdout]

api: yes
apiAddress: :9997

authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
        path:
      - action: read
        path:
      - action: playback
        path:
  - user: any
    pass:
    ips: []
    permissions:
      - action: api
      - action: metrics
      - action: pprof

srt: yes
srtAddress: :8890

rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]

webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins: ["*"]
webrtcICEServers2: []

hls: yes
hlsAddress: :8888
hlsAllowOrigins: ["*"]
# Standard (non-low-latency) HLS for resilience on the boat's unreliable uplink.
# The fmp4 variant (not mpegts) is required because the stream is H265 + Opus.
# Larger segments and a deep window let viewers buffer several seconds and ride
# out dropouts, trading latency (~6-10s) for smoothness. fmp4 also avoids the
# LL-HLS part-duration drift that breaks iOS clients.
hlsVariant: fmp4
hlsSegmentCount: 10
hlsSegmentDuration: 2s
hlsAlwaysRemux: yes
hlsCDNSecret: "scarlet-hls-internal"

paths:
  live:
    source: publisher
