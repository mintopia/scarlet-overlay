logLevel: info
logDestinations: [stdout]

api: yes
apiAddress: :9997

authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
        path:
      - action: read
        path:
      - action: playback
        path:
  - user: any
    pass:
    ips: []
    permissions:
      - action: api
      - action: metrics
      - action: pprof

srt: yes
srtAddress: :8890

rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]

webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins: ["*"]
webrtcICEServers2: []

hls: yes
hlsAddress: :8888
hlsAllowOrigins: ["*"]
# Standard (non-low-latency) HLS for resilience on the boat's unreliable uplink.
# The fmp4 variant (not mpegts) is required because the stream is H265 + Opus.
# Larger segments and a deep window let viewers buffer several seconds and ride
# out dropouts, trading latency (~6-10s) for smoothness. fmp4 also avoids the
# LL-HLS part-duration drift that breaks iOS clients.
hlsVariant: fmp4
hlsSegmentCount: 10
hlsSegmentDuration: 2s
hlsAlwaysRemux: yes
hlsCDNSecret: "scarlet-hls-internal"

paths:
  # SRT source (H265 + Opus) pulled from the BELABOX relay. Set via the API.
  live:
    source: publisher
    # Windows browsers can't decode HEVC via MSE/hls.js, so transcode the source
    # to H264 + AAC for browser playback. ffmpeg reads this path over RTSP and
    # republishes to `live_web`, which is what browsers consume. A keyframe every
    # 2s keeps HLS segments aligned. veryfast keeps CPU reasonable; raise the
    # preset (or add hardware accel) if the host has headroom.
    #
    # NOTE: deliberately NOT using -tune zerolatency. The HLS window is already
    # ~6-10s latent (hlsSegmentCount), so ultra-low encoder latency buys nothing,
    # and its sliced-threads + zero-lookahead make x264 brittle to the jitter of
    # the RTSP loopback (stutter/dropped frames). Frame-threading + default
    # lookahead matches what a smooth VLC transcode does. -thread_queue_size gives
    # the loopback reader a buffer so a momentary encoder hiccup doesn't backpressure
    # the SRT source into dropping frames.
    runOnReady: ffmpeg -rtsp_transport tcp -thread_queue_size 1024 -i rtsp://localhost:8554/$MTX_PATH -c:v libx264 -preset veryfast -pix_fmt yuv420p -force_key_frames expr:gte(t,n_forced*2) -b:v 6000k -maxrate 6000k -bufsize 12000k -c:a aac -b:a 128k -ar 48000 -f rtsp rtsp://localhost:8554/live_web
    runOnReadyRestart: yes

  # Browser-facing H264/AAC stream, published by the transcode above.
  live_web:
    source: publisher
