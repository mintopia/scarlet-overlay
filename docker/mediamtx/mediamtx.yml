logLevel: info
logDestinations: [stdout]

api: yes
apiAddress: :9997

authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
        path:
      - action: read
        path:
      - action: playback
        path:
  - user: any
    pass:
    ips: []
    permissions:
      - action: api
      - action: metrics
      - action: pprof

srt: yes
srtAddress: :8890

rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]

webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins: ["*"]
webrtcICEServers2: []

hls: yes
hlsAddress: :8888
hlsAllowOrigins: ["*"]
# Standard (non-low-latency) HLS for resilience on the boat's unreliable uplink.
# The fmp4 variant (not mpegts) is required because the stream is H265 + Opus.
# Larger segments and a deep window let viewers buffer several seconds and ride
# out dropouts, trading latency (~6-10s) for smoothness. fmp4 also avoids the
# LL-HLS part-duration drift that breaks iOS clients.
hlsVariant: fmp4
# 15 × 2s = a 30s window. Wider than the client's live-latency cap
# (liveMaxLatencyDurationCount in useVideoFeed.js) so a stalled player can
# re-sync without ever requesting a segment that's already rolled off (404).
hlsSegmentCount: 15
hlsSegmentDuration: 2s
hlsAlwaysRemux: yes
hlsCDNSecret: "scarlet-hls-internal"

paths:
  # SRT source (H265 + Opus) pulled from the BELABOX relay. Set via the API.
  live:
    source: publisher
    # Windows browsers can't decode HEVC via MSE/hls.js, so transcode the source
    # to H264 + AAC for browser playback. ffmpeg republishes to `live_web`, which
    # is what browsers consume. A keyframe every 2s keeps HLS segments aligned.
    # veryfast keeps CPU reasonable; raise the preset (or add hardware accel) if
    # the host has headroom.
    #
    # INPUT over internal SRT, NOT the RTSP loopback. The RTSP republish of this
    # H265 corrupts the bitstream (lost references / "PPS id out of range") — an
    # A/B decode of the same `live` path measured ~188 errors/25s over RTSP vs 0
    # over SRT (and VLC on the raw SRT is flawless), causing visible chop every
    # few seconds. MediaMTX's SRT delivery keeps the MPEG-TS intact, exactly like
    # VLC reads it.
    #
    # NOTE: deliberately NOT using -tune zerolatency. The HLS window is already
    # ~6-10s latent (hlsSegmentCount), so ultra-low encoder latency buys nothing,
    # and its sliced-threads + zero-lookahead make x264 brittle to input jitter.
    # Frame-threading + default lookahead matches what a smooth VLC transcode does.
    #
    # Output: -rtsp_transport tcp publishes straight over TCP (the server only
    # allows TCP, so the default UDP attempt otherwise fails SETUP with 461 on
    # startup). -pkt_size 1316 keeps RTP payloads under MediaMTX's 1440 limit
    # (ffmpeg's 1472 default produces 1460-byte packets it has to re-fragment).
    runOnReady: ffmpeg -thread_queue_size 1024 -i "srt://localhost:8890?streamid=read:$MTX_PATH" -c:v libx264 -preset veryfast -pix_fmt yuv420p -force_key_frames expr:gte(t,n_forced*2) -b:v 6000k -maxrate 6000k -bufsize 12000k -c:a aac -b:a 128k -ar 48000 -rtsp_transport tcp -pkt_size 1316 -f rtsp rtsp://localhost:8554/live_web
    runOnReadyRestart: yes

  # Browser-facing H264/AAC stream, published by the transcode above.
  live_web:
    source: publisher
    # Keep-alive: under hlsCDNSecret, hlsAlwaysRemux does NOT create an always-on
    # muxer (muxers are per-authenticated-request and close hlsMuxerCloseAfter
    # idle), so HLS delivery is effectively on-demand — when the last viewer
    # leaves, the muxer closes and the next viewer gets a fresh muxer with a NEW
    # segment prefix, 404'ing reconnecting players (the stop/start). This internal
    # reader pings the muxer every 20s (< the 1m close timer) so it stays open and
    # its prefix never rotates. The CDN bearer skips the cookie-check redirect.
    runOnReady: "sh -c 'while true; do wget -q --header=\"Authorization: Bearer scarlet-hls-internal\" -O /dev/null \"http://127.0.0.1:8888/live_web/index.m3u8\" || true; sleep 20; done'"
    runOnReadyRestart: yes
