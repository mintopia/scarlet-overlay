extensions:
  bearertokenauth:
    token: "${OTEL_AUTH_TOKEN}"

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        auth:
          authenticator: bearertokenauth
      http:
        endpoint: 0.0.0.0:4318
        auth:
          authenticator: bearertokenauth

processors:
  batch:
    timeout: 10s
    send_batch_size: 1024

  memory_limiter:
    check_interval: 5s
    limit_mib: 256
    spike_limit_mib: 64

  # Drop datapoints that lack device identity (non-boat / stray series).
  # NOTE: the in-pipeline resource key is DOTTED `device.id` (confirmed via a
  # 0.154.0 debug dump), NOT `device_id`. The underscore form is only created
  # later by the prometheusremotewrite exporter's resource_to_telemetry_conversion.
  # The previous `device_id` (underscore) condition was nil for EVERY datapoint,
  # so this filter silently dropped 100% of telemetry after the collector rolled
  # to 0.154.0 — the 2026-06-19 outage. Match the dotted key. See ADR 0006.
  filter/dedup:
    error_mode: ignore
    metrics:
      datapoint:
        - 'resource.attributes["device.id"] == nil'

  # --- Normalization (Phase 4, Stage 1: declarative, panic-proof) ---
  # Strip noise DATAPOINT attributes. `value` is the important one: on
  # mqtt.last_seen and the signalk string metrics it carries a CHANGING string
  # (timestamps, gnss.type, ...) that would spawn a new series on every change.
  # `key` / `instance` are deleted defensively (no-op when absent). `topic` and
  # `gps.source` are intentionally kept (they become useful labels).
  #
  # We deliberately do NOT strip the `service.name` resource attribute: the
  # exporter derives BOTH the redundant `service_name` label AND the wanted `job`
  # label from it, with no declarative way to split them (a datapoint attribute
  # named `job` is not promoted to a label — the exporter reserves job/instance
  # for resource-derived values). `service_name` is a constant (zero cardinality
  # cost), so keeping it to preserve `job` is the right trade.
  attributes/strip:
    actions:
      - key: value
        action: delete
      - key: key
        action: delete
      - key: instance
        action: delete

  # --- Normalization (Phase 4, Stage 2: drop uncurated EcoFlow series) ---
  # EcoFlow publishes ~125 fields as mqtt.value{topic="ecoflow/<serial>_<report>/<field>"}.
  # Keep only the ~20 curated fields (jess-approved); drop the rest. The filter
  # primitive is "drop the datapoint when the condition is true", so the single
  # condition reads: it IS an mqtt.value datapoint AND it HAS a topic AND the topic
  # is an ecoflow/ topic AND the trailing /<field> is NOT one of the curated fields.
  #
  # Why this cannot crash-loop (the earlier OTTL transform attempts did):
  #  * error_mode: ignore  -> any per-datapoint evaluation error is logged and the
  #    condition treated as false (datapoint kept), never a panic / dropped batch.
  #  * The `attributes["topic"] != nil` guard runs BEFORE IsMatch and OTTL `and`
  #    short-circuits, so IsMatch is never handed a nil -> no nil deref.
  #  * Read-only predicates only (no set/replace/delete_key editors), so nothing
  #    can fault while mutating a datapoint.
  filter/ecoflow:
    error_mode: ignore
    metrics:
      datapoint:
        - >-
          metric.name == "mqtt.value"
          and attributes["topic"] != nil
          and IsMatch(attributes["topic"], "^ecoflow/")
          and not IsMatch(attributes["topic"],
            "/(soc|f32ShowSoc|actSoc|inputWatts|outputWatts|powInSumW|powOutSumW|powGetAc|powGetAcIn|powGet_12v|powGetTypec1|powGetTypec2|powGetQcusb1|powGetQcusb2|vol|amp|temp|remainTime|cycles|soh)$")

exporters:
  prometheusremotewrite:
    endpoint: http://victoriametrics:8428/api/v1/write
    namespace: scarlet
    resource_to_telemetry_conversion:
      enabled: true
    # Drop otel_scope_name / otel_scope_version labels declaratively (panic-proof,
    # no OTTL). Phase-4 Stage 1.
    disable_scope_info: true

service:
  extensions: [bearertokenauth]

  telemetry:
    logs:
      level: info

  pipelines:
    metrics:
      receivers: [otlp]
      # Order: declarative strips, then the EcoFlow drop, then batch last so
      # batching sees the final normalized shape.
      processors: [memory_limiter, filter/dedup, attributes/strip, filter/ecoflow, batch]
      exporters: [prometheusremotewrite]
