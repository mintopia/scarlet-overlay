extensions:
  bearertokenauth:
    token: "${OTEL_AUTH_TOKEN}"

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        auth:
          authenticator: bearertokenauth
      http:
        endpoint: 0.0.0.0:4318
        auth:
          authenticator: bearertokenauth

processors:
  batch:
    timeout: 10s
    send_batch_size: 1024

  memory_limiter:
    check_interval: 5s
    limit_mib: 256
    spike_limit_mib: 64

  filter/dedup:
    error_mode: ignore
    metrics:
      datapoint:
        - 'resource.attributes["device_id"] == nil'

  # Drop the EcoFlow fields we don't care about. The Delta publishes 125 BMS/runtime
  # fields under ecoflow/<serial>_<report>/<field>; we keep only the curated subset
  # (SOC, input/output power per channel, voltage, current, temperature, time-remaining,
  # cycles/SOH) and drop the rest. Edit the keep-list below to adjust.
  filter/ecoflow:
    error_mode: ignore
    metrics:
      datapoint:
        - 'metric.name == "mqtt.value" and IsMatch(datapoint.attributes["topic"], "^ecoflow/") and not IsMatch(datapoint.attributes["topic"], "/(soc|f32ShowSoc|actSoc|inputWatts|outputWatts|powInSumW|powOutSumW|powGetAc|powGetAcIn|powGet_12v|powGetTypec1|powGetTypec2|powGetQcusb1|powGetQcusb2|vol|amp|temp|remainTime|cycles|soh)$")'

  # Strip inconsistent / noise labels that pollute every series and create duplicates.
  # `key` is the worst offender (present-or-absent → duplicate series, e.g. 252 for
  # scarlet_mqtt_value); `value`, `instance`, `service_name`, and the otel_scope_* labels
  # add no signal. `instance` is mapped from the service.instance.id resource attribute.
  # Meaningful labels (device_id, device_mode, gps_source, topic, path, carrier, rat, ssid…) are kept.
  transform/normalize_labels:
    error_mode: ignore
    metric_statements:
      - delete_key(resource.attributes, "service.name")
      - delete_key(resource.attributes, "service.instance.id")
      - delete_key(datapoint.attributes, "key")
      - delete_key(datapoint.attributes, "value")
      - delete_key(datapoint.attributes, "instance")
      - set(scope.name, "")
      - set(scope.version, "")

exporters:
  prometheusremotewrite:
    endpoint: http://victoriametrics:8428/api/v1/write
    namespace: scarlet
    resource_to_telemetry_conversion:
      enabled: true

service:
  extensions: [bearertokenauth]

  telemetry:
    logs:
      level: info

  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, filter/dedup, filter/ecoflow, transform/normalize_labels, batch]
      exporters: [prometheusremotewrite]
