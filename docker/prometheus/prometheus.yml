global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    scrape_interval: 15s
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: scarlet-srt
    scrape_interval: 15s
    metrics_path: /metrics/srt
    static_configs:
      - targets: ['app:80']
