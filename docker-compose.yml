services:
  app:
    build:
      context: .
      dockerfile: docker/production/Dockerfile
    ports:
      - "${APP_PORT:-80}:80"
    env_file: .env
    depends_on:
      - mariadb
      - redis
      - reverb
    networks:
      - scarlet

  reverb:
    build:
      context: .
      dockerfile: docker/production/Dockerfile
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    env_file: .env
    depends_on:
      - redis
    networks:
      - scarlet

  horizon:
    build:
      context: .
      dockerfile: docker/production/Dockerfile
    command: php artisan horizon
    env_file: .env
    depends_on:
      - redis
      - reverb
    networks:
      - scarlet

  metrics:
    build:
      context: .
      dockerfile: docker/production/Dockerfile
    command: php artisan metrics:push
    env_file: .env
    depends_on:
      - redis
      - otel-collector
      - reverb
    networks:
      - scarlet

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: "${DB_DATABASE:-scarlet}"
      MARIADB_USER: "${DB_USERNAME:-scarlet}"
      MARIADB_PASSWORD: "${DB_PASSWORD:-secret}"
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - scarlet

  redis:
    image: redis:alpine
    volumes:
      - redis-data:/data
    networks:
      - scarlet

  mediamtx:
    # -ffmpeg variant bundles ffmpeg, used to transcode the H265 source to H264
    # for browser playback (see runOnReady in docker/mediamtx/mediamtx.yml).
    image: bluenviron/mediamtx:latest-ffmpeg
    ports:
      - "${MEDIAMTX_WEBRTC_PORT:-8889}:8889"
      - "${MEDIAMTX_SRT_PORT:-8890}:8890/udp"
    volumes:
      - ./docker/mediamtx/mediamtx.yml:/mediamtx.yml:ro
    networks:
      - scarlet

  otel-collector:
    # Pinned, NOT :latest — an unpinned roll to 0.154.0 during a compose down/up
    # silently changed OTTL attribute handling and dropped 100% of telemetry for
    # ~7h on 2026-06-19. Bump deliberately, with the config re-validated. See ADR 0006.
    image: otel/opentelemetry-collector-contrib:0.154.0
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
    environment:
      OTEL_AUTH_TOKEN: "${OTEL_AUTH_TOKEN}"
    volumes:
      - ./docker/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - victoriametrics
    networks:
      - scarlet

  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    ports:
      - "${VICTORIAMETRICS_PORT:-8428}:8428"
    volumes:
      - victoriametrics-data:/victoria-metrics-data
      - ./docker/victoriametrics/scrape.yml:/etc/victoriametrics/scrape.yml:ro
    command:
      - "-retentionPeriod=100y"
      - "-search.latencyOffset=0s"
      - "-promscrape.config=/etc/victoriametrics/scrape.yml"
    networks:
      - scarlet

volumes:
  mariadb-data:
  redis-data:
  victoriametrics-data:

networks:
  scarlet:
