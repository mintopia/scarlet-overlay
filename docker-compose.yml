services:
  app:
    build:
      context: .
      dockerfile: docker/production/Dockerfile
    ports:
      - "${APP_PORT:-80}:80"
    env_file: .env
    depends_on:
      - mariadb
      - redis
      - reverb
    networks:
      - scarlet

  reverb:
    build:
      context: .
      dockerfile: docker/production/Dockerfile
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    env_file: .env
    depends_on:
      - redis
    networks:
      - scarlet

  horizon:
    build:
      context: .
      dockerfile: docker/production/Dockerfile
    command: php artisan horizon
    env_file: .env
    depends_on:
      - redis
      - reverb
    networks:
      - scarlet

  metrics:
    build:
      context: .
      dockerfile: docker/production/Dockerfile
    command: php artisan metrics:push
    env_file: .env
    depends_on:
      - redis
      - prometheus
      - reverb
    networks:
      - scarlet

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: "${DB_DATABASE:-scarlet}"
      MARIADB_USER: "${DB_USERNAME:-scarlet}"
      MARIADB_PASSWORD: "${DB_PASSWORD:-secret}"
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - scarlet

  redis:
    image: redis:alpine
    volumes:
      - redis-data:/data
    networks:
      - scarlet

  mediamtx:
    image: bluenviron/mediamtx:latest
    ports:
      - "${MEDIAMTX_WEBRTC_PORT:-8889}:8889"
      - "${MEDIAMTX_SRT_PORT:-8890}:8890/udp"
    volumes:
      - ./docker/mediamtx/mediamtx.yml:/mediamtx.yml:ro
    networks:
      - scarlet

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
    environment:
      OTEL_AUTH_TOKEN: "${OTEL_AUTH_TOKEN}"
    volumes:
      - ./docker/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks:
      - scarlet

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - otel-collector
    networks:
      - scarlet

volumes:
  mariadb-data:
  redis-data:
  prometheus-data:

networks:
  scarlet:
